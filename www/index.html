<!-- ============================================================
     Скрытый storage для элементов, на которые ссылается
     внутренняя логика. Пользователь их не видит.
     ВАЖНО: #listLeft / #listRight ОБЯЗАТЕЛЬНЫ — их клонирует
     WM Explorer в окна Проводника.
     ============================================================ -->
<div id="panelModeStorage" style="display:none;" aria-hidden="true">
    <button id="btnUpload" disabled></button>
    <button id="btnMkdir" disabled></button>
    <button id="btnCopy" disabled></button>
    <button id="btnMove" disabled></button>
    <button id="btnDownload" disabled></button>
    <button id="btnZip" disabled></button>
    <button id="btnDelete" disabled></button>
    <button id="btnRefresh" disabled></button>
    <button id="btnDebug" disabled></button>
    <button id="btnGamepad"></button>
    <button id="btnGpu"></button>
    <button id="btnOllama"></button>
    <button id="btnConsole" style="display:none;"></button>
    <button id="btnVideoChat" style="display:none;"></button>
    <button id="btnBroadcast" style="display:none;"></button>
    <button id="btnAuth"></button>
    <button id="btnWM"></button>
    <button id="gpModeIndicator"></button>

    <div id="panelLeft"><div class="file-list" id="listLeft"></div></div>
    <div id="panelRight"><div class="file-list" id="listRight"></div></div>

    <span id="statusText"></span>
    <span id="statusLeft"></span>
    <span id="statusRight"></span>
    <span id="totalSize"></span>
    <span id="selInfo"></span>
    <span id="pathLeft"></span>
    <span id="pathRight"></span>
</div>

<!-- ============================================================
     Сюда 23-main.js (injectModals) вставит все модалки.
     ВАЖНО: оставьте этот div ПУСТЫМ.
     ============================================================ -->
<div id="modalRoot"></div>

<!-- ============================================================
     Экран Login — показывается неавторизованному пользователю.
     Одна кнопка по центру. Пока пользователь не авторизуется,
     ничего другого он не видит (кроме самой модалки подключения).
     z-index: 8000 (см. css/base.css).
     ============================================================ -->
<div id="loginScreen" class="login-screen hidden">
    <button type="button" class="login-screen-btn" onclick="FAR.openConnModal(false)">
        Login
    </button>
</div>

<div class="toast-container" id="toastContainer"></div>

<div id="connModal" class="modal-overlay hidden">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 id="connTitle">🔐 Подключение к FileBD</h3>
            <button class="close-btn" id="connCloseBtn" onclick="FAR.closeConnModal()" style="display:none;">✕</button>
        </div>
        <div class="modal-body">
            <div class="conn-form">
                <div class="conn-target" id="connTarget" style="display:none;">
                    Подключение только для панели: <b id="connTargetName">—</b>
                </div>

                <div class="conn-field">
                    <label for="connType">Тип источника</label>
                    <select id="connType" onchange="FAR._connModalUpdateFields()">
                        <option value="couchdb">🗄️ CouchDB / PouchDB (удалённый сервер)</option>
                        <option value="filesystem">💾 Локальный диск (FileServer.java)</option>
                    </select>
                </div>

                <div class="conn-field">
                    <label for="connUrl" id="connUrlLabel">Адрес БД (с портом)</label>
                    <input type="text" id="connUrl" placeholder="http://192.168.15.20:5984" autocomplete="off">
                </div>

                <div class="conn-field" id="connDbRow">
                    <label for="connDb">Имя базы данных</label>
                    <input type="text" id="connDb" placeholder="FileBD" autocomplete="off">
                </div>

                <div class="conn-field" id="connUserRow">
                    <label for="connUser">Имя пользователя</label>
                    <input type="text" id="connUser" placeholder="username" autocomplete="username">
                </div>

                <div class="conn-field" id="connPassRow">
                    <label for="connPass">Пароль пользователя</label>
                    <input type="password" id="connPass" placeholder="password" autocomplete="current-password">
                </div>

                <div class="conn-field" id="connUiModeRow">
                    <label for="connUiMode">Режим работы после подключения</label>
                    <select id="connUiMode">
                        <option value="panel">🗔 Панельный (FAR-подобный)</option>
                        <option value="wm">🖥 Оконный (рабочий стол)</option>
                    </select>
                </div>

                <div class="conn-error" id="connError"></div>
                <div class="conn-hint">
                    После подключения вы увидите только те каталоги, к которым у вас есть доступ.
                </div>
                <div class="conn-actions">
                    <button class="btn-cancel" onclick="FAR.closeConnModal()" id="connCancelBtn">Отмена</button>
                    <button class="btn-connect" id="connConnectBtn" onclick="FAR.submitConnModal()">Подключиться</button>
                </div>
            </div>
        </div>
    </div>
</div>

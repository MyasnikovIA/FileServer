<div id="viewerModal" class="modal-overlay hidden" onclick="FAR.closeViewerOutside(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 id="viewerTitle">📄 Просмотр</h3>
            <div class="modal-header-actions">
                <button class="viewer-nav-btn" id="viewerPrevBtn"
                        onclick="FAR.viewerNavigate(-1)"
                        title="Предыдущий файл">◀</button>
                <button class="viewer-nav-btn" id="viewerNextBtn"
                        onclick="FAR.viewerNavigate(+1)"
                        title="Следующий файл">▶</button>
                <button class="close-btn" onclick="FAR.closeViewer()">✕</button>
            </div>
        </div>
        <div class="modal-body" id="viewerBody">Загрузка…</div>
        <div class="modal-footer">
            <span id="viewerInfo"></span>
            <button onclick="FAR.downloadCurrentFile()">📥 Скачать</button>
        </div>
    </div>
</div>
